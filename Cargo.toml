[package]
name = "seq-hasher"
version = "0.4.0"
authors = ["Antonio Camargo"]
edition = "2021"
description = "Compute hash digests for sequences in a FASTA file"
readme = "README.md"
homepage = "https://github.com/apcamargo/seq-hasher"
repository = "https://github.com/apcamargo/seq-hasher"
license = "MIT"

[dependencies]
bytemuck = "1.25.0"
clap = { version = "4.5.17", features = ["derive", "wrap_help"] }
clio = { version = "0.3.5", features = ["clap-parse"] }
hex = "0.4.3"
itertools = "0.13.0"
needletail = "0.6.1"
nthash-rs = "0.1.3"
twox-hash = {
  version = "2.1.2",
  default-features = false,
  features = [
    "std",
    "xxhash3_64",
    "xxhash3_128",
  ]
}
